services:
  stash-bot:
    container_name: "${CONTAINER_NAME_PREFIX:-}stash-bot"
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      ROOT_ID: "${ROOT_ID}"
      STASH_URL: "${STASH_URL:-http://stash:8080}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-stash-bot}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}"
      # Temporary public API path while the shared API egress is being rebuilt.
      TELEGRAM_LOCAL_API_URL: ""
      HTTPS_PROXY: "${TELEGRAM_HTTPS_PROXY:-socks5://host.docker.internal:10880}"
      NO_PROXY: "stash,telegram-bot-api,jaeger,localhost,127.0.0.1"
      # Passthrough for the repair-media one-shot tool (DRY_RUN=1 to preview).
      DRY_RUN: "${DRY_RUN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared volume from the local Bot API server: lets the bot read
      # downloaded files directly from disk (GetFile returns absolute paths).
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    networks:
      - stash-bot-net
      - stash-api-net
      - telegram-net
      - jaeger-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

networks:
  stash-bot-net:
  stash-api-net:
    external: true
    name: stash-api-net
  telegram-net:
    external: true
    name: telegram-net
  jaeger-net:
    external: true
    name: jaeger-net

volumes:
  telegram-bot-api-data:
    external: true
    name: telegram-bot-api-data
