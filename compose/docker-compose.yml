services:
  stash-bot:
    container_name: "${CONTAINER_NAME_PREFIX:-}stash-bot"
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION:?Run via make}
        ALPINE_VERSION: ${ALPINE_VERSION:?Run via make}
    restart: unless-stopped
    # Local Bot API creates private directories/files (0700/0600). Run with
    # its numeric owner, while keeping the shared volume read-only.
    user: "${TELEGRAM_FILE_UID:-101}:${TELEGRAM_FILE_GID:-101}"
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      ROOT_ID: "${ROOT_ID}"
      STASH_URL: "${STASH_URL:-http://stash:8080}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-stash-bot}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}"
      # Optional local Bot API endpoint; empty selects Telegram's public API.
      TELEGRAM_LOCAL_API_URL: "${TELEGRAM_LOCAL_API_URL:-}"
      HTTPS_PROXY: "${TELEGRAM_HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-stash,telegram-bot-api,jaeger,localhost,127.0.0.1}"
      # Passthrough for the repair-media one-shot tool (DRY_RUN=1 to preview).
      DRY_RUN: "${DRY_RUN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared volume from the local Bot API server: lets the bot read
      # downloaded files directly from disk (GetFile returns absolute paths).
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    networks:
      - stash-bot-net
      - stash-api-net
      - telegram-net
      - jaeger-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

networks:
  stash-bot-net:
  stash-api-net:
    external: true
    name: stash-api-net
  telegram-net:
    external: true
    name: telegram-net
  jaeger-net:
    external: true
    name: jaeger-net

volumes:
  telegram-bot-api-data:
    external: true
    name: telegram-bot-api-data
